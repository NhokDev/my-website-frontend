<div
    class="scene relative isolate grid h-107.5 place-items-center [@media(max-width:800px)]:mx-auto [@media(max-width:800px)]:mt-5.5 [@media(max-width:800px)]:mb-2.5 [@media(380px<width<=800px)]:h-85 [@media(max-width:800px)]:max-w-107.5 [@media(max-width:380px)]:h-77.5 forced-colors:invisible"
>
    <div
        class="halo absolute inset-0 -z-1 [background:radial-gradient(ellipse_at_60%_40%,#a855f738,transparent_65%),radial-gradient(ellipse_at_20%_70%,#06b6d422,transparent_60%)] mask-[radial-gradient(ellipse_at_center,#000_25%,transparent_70%)]"
    ></div>
    <div class="orbital-float motion-layer animate-orbital-float motion-reduce:animate-none">
        <div
            class="orbit relative size-[350px] perspective-[850px] [@media(max-width:800px)]:transform-[scale(0.8)] [@media(max-width:380px)]:size-[290px]"
        >
            <div
                class="ring-back absolute -inset-x-1 inset-y-23.75 rounded-[50%] border-11 border-[#c8b9f5] opacity-[0.45] [box-shadow:0_0_18px_#a855f744,inset_0_0_12px_#f4edff44] transform-[rotate(-28deg)_rotateX(57deg)]"
            ></div>
            <div
                class="planet absolute inset-14.75 rounded-[50%] [background:radial-gradient(ellipse_at_30%_23%,#e9e1ff,#b99af7_22%,var(--color-primary)_40%,#573085_65%,#160e2d_88%)] [box-shadow:inset_-18px_-20px_30px_#120d1d99,inset_8px_8px_20px_#ede4ff55,0_0_50px_#a855f726] transform-[rotate(-23deg)] after:absolute after:inset-[10%] after:rounded-[inherit] after:[background:repeating-radial-gradient(ellipse_at_60%_70%,transparent_0_16px,#e9e1ff18_17px_18px)] after:content-['']"
            ></div>
            <div
                class="ring-front absolute -inset-x-1 inset-y-23.75 rounded-[50%] border-11 border-[#c8b9f5] [box-shadow:0_0_18px_#a855f744,inset_0_0_12px_#f4edff44] [clip-path:polygon(0_48%,100%_48%,100%_100%,0_100%)] transform-[rotate(-28deg)_rotateX(57deg)]"
            ></div>
            <div
                class="fine-ring absolute inset-x-5 inset-y-8.75 rounded-[50%] border border-secondary opacity-70 transform-[rotate(42deg)_rotateX(62deg)]"
            ></div>
            <span
                class="spark spark-one absolute top-9.5 right-18.5 size-1.5 rounded-[50%] bg-[#b4f4ef] [box-shadow:0_0_16px_var(--color-secondary)]"
            ></span>
            <span
                class="spark spark-two absolute bottom-15 left-6 size-1 rounded-[50%] bg-[#b4f4ef] [box-shadow:0_0_16px_var(--color-secondary)]"
            ></span>
        </div>
    </div>
    <div
        class="annotation glass absolute top-4 right-0 rounded-[14px] px-4.5 py-3.5 transform-[rotate(4deg)] [@media(max-width:800px)]:top-2 [@media(max-width:800px)]:right-1.25"
    >
        <span class="mb-1.25 block text-[0.7rem] text-(--text-muted)">{{
            'home.orbit.mindset' | transloco
        }}</span
        ><strong class="text-[0.8rem] font-semibold">{{
            'home.orbit.exploring' | transloco
        }}</strong>
    </div>
    <div
        class="annotation annotation-bottom glass absolute bottom-2.5 left-0 rounded-[14px] px-4.5 py-3.5 transform-[rotate(-4deg)] [@media(max-width:800px)]:bottom-0 [@media(max-width:800px)]:left-1.25"
    >
        <span class="mb-1.25 block text-[0.7rem] text-(--text-muted)">{{
            'home.orbit.process' | transloco
        }}</span
        ><strong class="text-[0.8rem] font-semibold">{{ 'home.orbit.repeat' | transloco }}</strong>
    </div>
</div>
