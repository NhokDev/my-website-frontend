<section class="route-page" aria-labelledby="projects-title">
    <p class="eyebrow">{{ 'projects.eyebrow' | transloco }}</p>
    <h1 id="projects-title" class="page-title">{{ 'projects.title' | transloco }}</h1>
    <p class="page-intro">
        {{ 'projects.description' | transloco }}
    </p>
    <h2 class="mb-6">{{ 'projects.current' | transloco }}</h2>
    <app-project-card [project]="project" />
    <a class="text-link mt-8" routerLink="/" fragment="about"
        >{{ 'projects.aboutLink' | transloco }} <span aria-hidden="true">↗</span></a
    >
</section>
