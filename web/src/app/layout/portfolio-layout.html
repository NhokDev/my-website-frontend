<a class="skip-link" href="#main-content">{{ 'shell.skip' | transloco }}</a>
<div
    class="site-frame relative isolate flex min-h-dvh flex-col overflow-clip bg-(--page-background) [&[data-motion=paused]_.motion-layer]:[animation-play-state:paused]"
    [attr.data-motion]="motionPaused() ? 'paused' : 'running'"
>
    <div
        class="ambient pointer-events-none absolute inset-0 -z-1 overflow-clip forced-colors:hidden"
        aria-hidden="true"
    >
        <div
            class="motion-layer absolute -top-56 left-[49%] size-[min(85vw,36rem)] animate-aurora-drift rounded-full [background:radial-gradient(circle,#8744cb66,#8446ad2e_45%,transparent_71%)] motion-reduce:animate-none"
        ></div>
        <div
            class="motion-layer absolute top-40 -left-[min(45vw,20rem)] size-[min(110vw,40rem)] animate-aurora-drift rounded-full [animation-delay:-6s] [background:radial-gradient(circle,#1166b766,#0e518033_42%,transparent_70%)] motion-reduce:animate-none"
        ></div>
        <div
            class="motion-layer absolute top-[43rem] -right-[min(40vw,15rem)] size-[min(90vw,38rem)] animate-aurora-drift rounded-full [animation-delay:-10s] [background:radial-gradient(circle,#19ac9c55,#7655ba33_47%,transparent_71%)] motion-reduce:animate-none"
        ></div>
        <div
            class="absolute top-300 left-[14%] h-112.5 w-[min(90vw,510px)] rounded-full bg-[radial-gradient(circle,#954fd084,transparent_68%)] opacity-85 blur-[78px]"
        ></div>
    </div>
    <header class="site-header page-width pt-6.25 [@media(max-width:690px)]:pt-3.75">
        <div
            class="glass nav-bar flex min-h-17.5 flex-wrap items-center justify-between gap-3 rounded-[18px] px-5.25 py-3.25 [@media(max-width:690px)]:px-3.25 [@media(max-width:690px)]:py-2.75 [@media(max-width:540px)]:justify-center [@media(max-width:540px)]:gap-0.5"
        >
            <a
                class="brand inline-flex min-h-11 items-center gap-2 text-[1.3rem] font-[750] tracking-[-0.055em] [@media(max-width:540px)]:w-full [@media(max-width:540px)]:justify-center"
                routerLink="/"
                [attr.aria-label]="'shell.homeLabel' | transloco"
            >
                <span
                    class="brand-mark grid size-8.5 place-items-center rounded-[11px] bg-[linear-gradient(125deg,#d8d2ff,#8f77f6)] text-[19px] text-[#1a1642] shadow-[0_0_23px_#af82f959]"
                    aria-hidden="true"
                    >✳</span
                >
                aurora<span class="brand-dot -ml-1.75 text-secondary" aria-hidden="true">.</span>
            </a>
            <nav
                class="flex flex-wrap items-center gap-1 *:inline-flex *:min-h-11 *:items-center *:gap-1.5 *:rounded-[10px] *:px-3 *:py-2 *:text-[0.875rem] *:text-(--text-muted)! sm:gap-3 [&>a:hover]:bg-(--surface-solid) [&>a:hover]:text-(--text)! [&>a.current]:bg-(--surface-solid) [&>a.current]:text-(--text)! [&>a.current]:underline! [&>a.current]:decoration-secondary! [&>a.current]:underline-offset-[7px]! [@media(max-width:540px)]:*:px-2.5"
                [attr.aria-label]="'shell.navigation' | transloco"
            >
                <a
                    routerLink="/"
                    routerLinkActive="current"
                    [routerLinkActiveOptions]="{ exact: true }"
                    ariaCurrentWhenActive="page"
                    >{{ 'shell.home' | transloco }}</a
                >
                <a routerLink="/projects" routerLinkActive="current" ariaCurrentWhenActive="page">{{
                    'shell.projects' | transloco
                }}</a>
                <a routerLink="/" fragment="about"
                    >{{ 'shell.about' | transloco }} <span aria-hidden="true">↗</span></a
                >
            </nav>
            <div
                role="group"
                [attr.aria-label]="'shell.language' | transloco"
                class="inline-flex shrink-0 items-center gap-1 rounded-full border border-(--border) bg-neutral/60 p-1 shadow-[inset_0_1px_0_#ffffff08] backdrop-blur-xl"
            >
                <button
                    type="button"
                    lang="es"
                    aria-label="Español"
                    [attr.aria-pressed]="transloco.getActiveLang() === 'es'"
                    (click)="changeLanguage('es')"
                    class="inline-flex min-h-11 min-w-11 cursor-pointer items-center justify-center gap-2 rounded-full border border-transparent px-3 text-sm font-semibold text-(--text-muted) hover:text-(--text) focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-(--focus) aria-pressed:border-white/15 aria-pressed:bg-white/12 aria-pressed:text-(--text) aria-pressed:shadow-[0_2px_6px_#00000026,inset_0_1px_0_#ffffff14]"
                >
                    <svg
                        class="h-3.5 w-5 shrink-0 rounded-[3px]"
                        viewBox="0 0 60 40"
                        aria-hidden="true"
                        focusable="false"
                    >
                        <path fill="#aa151b" d="M0 0h60v40H0z" />
                        <path fill="#f1bf00" d="M0 10h60v20H0z" />
                    </svg>
                    ES
                </button>
                <button
                    type="button"
                    lang="en"
                    aria-label="English"
                    [attr.aria-pressed]="transloco.getActiveLang() === 'en'"
                    (click)="changeLanguage('en')"
                    class="inline-flex min-h-11 min-w-11 cursor-pointer items-center justify-center gap-2 rounded-full border border-transparent px-3 text-sm font-semibold text-(--text-muted) hover:text-(--text) focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-(--focus) aria-pressed:border-white/15 aria-pressed:bg-white/12 aria-pressed:text-(--text) aria-pressed:shadow-[0_2px_6px_#00000026,inset_0_1px_0_#ffffff14]"
                >
                    <svg
                        class="h-3.5 w-5 shrink-0 rounded-[3px]"
                        viewBox="0 0 60 40"
                        aria-hidden="true"
                        focusable="false"
                    >
                        <path fill="#012169" d="M0 0h60v40H0z" />
                        <path stroke="#fff" stroke-width="8" d="m0 0 60 40M60 0 0 40" />
                        <path stroke="#c8102e" stroke-width="3" d="m0 0 60 40M60 0 0 40" />
                        <path stroke="#fff" stroke-width="12" d="M30 0v40M0 20h60" />
                        <path stroke="#c8102e" stroke-width="6" d="M30 0v40M0 20h60" />
                    </svg>
                    EN
                </button>
            </div>
        </div>
    </header>
    <main id="main-content" class="page-width flex-1" tabindex="-1">
        <router-outlet />
    </main>
    <footer class="page-width">
        <div
            class="footer-inner mt-16 flex flex-wrap items-center justify-between gap-4 border-t border-(--border) py-7 text-[0.8rem] text-(--text-muted) [&_a]:inline-flex [&_a]:min-h-11 [&_a]:items-center [&_span]:mx-2"
        >
            <p>Aurora <span aria-hidden="true">/</span> {{ 'shell.portfolio' | transloco }}</p>
            <button
                type="button"
                [attr.aria-pressed]="motionPaused()"
                (click)="toggleMotion()"
                class="inline-flex min-h-11 cursor-pointer items-center justify-center rounded-full border border-(--border-control) bg-neutral/50 px-4 text-[0.8rem] hover:bg-(--surface-solid) focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-(--focus) aria-pressed:border-(--focus) aria-pressed:bg-(--surface-solid) aria-pressed:text-(--text)"
            >
                {{ 'shell.pauseMotion' | transloco }}
            </button>
            <a routerLink="/" fragment="next-chapter"
                >{{ 'shell.curiosity' | transloco }} <span aria-hidden="true">↗</span></a
            >
        </div>
    </footer>
</div>
